# ============================================================
# Application Configuration
# ALL CREDENTIALS MUST BE PROVIDED VIA ENVIRONMENT VARIABLES
# DO NOT ADD DEFAULT VALUES FOR SENSITIVE DATA
# ============================================================
# Server / TLS: handled by WildFly (Undertow + Elytron). No embedded-server config here.
# PostgreSQL: provided by WildFly as a JNDI datasource (see standalone-lindseywebsite.xml).
spring.datasource.jndi-name=java:/LindseyDS
# Spring Cache Configuration (uses Caffeine in-memory cache)
spring.cache.type=caffeine
# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
# Hibernate Second-Level Cache - DISABLED (using Spring Cache with Caffeine instead)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
# Hibernate Statistics (useful for debugging)
spring.jpa.properties.hibernate.generate_statistics=${HIBERNATE_STATISTICS:false}
# Image serving configuration
spring.web.resources.static-locations=classpath:/static/,classpath:/Images/
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true
# Logging
logging.level.com.lindseyayresart=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
# Email Configuration: transport is the WildFly-managed JNDI mail session.
# spring.mail.username is still read by EmailService for the default 'from' address.
spring.mail.jndi-name=java:jboss/mail/Lindsey
spring.mail.username=${SPRING_MAIL_USERNAME}
# Order email relay: send AS orders@, but customer replies land in Lindsey's personal inbox.
# The SMTP account (SPRING_MAIL_USERNAME) must be authorized to send as 'orders-from'.
app.mail.orders-from=${APP_MAIL_ORDERS_FROM:orders@lindseyayresart.com}
app.mail.orders-from-name=${APP_MAIL_ORDERS_FROM_NAME:Lindsey Ayres Art}
app.mail.reply-to=${APP_MAIL_REPLY_TO:lindsey@lindseyayresart.com}
#Square API Configuration
external.api.square.access-token=${EXTERNAL_API_SQUARE_ACCESS_TOKEN}
external.api.square.location-id=${EXTERNAL_API_SQUARE_LOCATION_ID}
external.api.square.application-id=${EXTERNAL_API_SQUARE_APPLICATION_ID}
external.api.square.use-sandbox=${EXTERNAL_API_SQUARE_USE_SANDBOX:true}
