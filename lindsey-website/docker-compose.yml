# ============================================================
# Docker Compose for Lindsey Website
#
# Provides ONLY the PostgreSQL database. The backend runs on WildFly 40 on the
# host (see run.sh + standalone-lindseywebsite.xml), connecting to this DB on
# localhost:${DB_PORT}.
#
# Usage (via run.sh, which also launches WildFly):
#   ./run.sh dev      Postgres + WildFly  (https://localhost:8443)
#   ./run.sh prod     Postgres + WildFly  (https://localhost:443)
# Or just the database:
#   docker compose --env-file .env.dev up -d postgres
# ============================================================

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: lindsey-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - lindsey-network

networks:
  lindsey-network:
    driver: bridge

volumes:
  postgres-data:
